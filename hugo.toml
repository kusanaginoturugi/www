baseURL = 'https://www.showway.biz/'
locale = 'ja'
defaultContentLanguage = 'ja'
defaultContentLanguageInSubdir = false
title = 'SHOWWAY'
theme = 'ananke'
enableRobotsTXT = true
enableEmoji = true
summaryLength = 30
copyright = 'SHOWWAY'
timeZone = 'Asia/Tokyo'

[pagination]
  pagerSize = 12

[permalinks]
  posts = '/:slug'

[uglyURLs]
  posts = true

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  description = 'IT 開発受託・コンサルティングの SHOWWAY 公式サイト'
  favicon = ''
  site_logo = ''
  recent_posts_number = 5
  show_reading_time = true
  show_taxonomies_in_meta = true
  show_intro = true
  intro_image = '/images/shizume.jpg'
  intro_image_hide_on_mobile = false
  background_color_class = 'bg-near-black'
  text_color = 'dark-gray'

[params.ananke.home]
  content_alignment = 'left'

[params.ananke]
  custom_css = ['custom.css']

[[params.ananke_socials]]
  name = 'github'
  url = 'https://github.com/kusanaginoturugi'

[languages]
  [languages.ja]
    locale = 'ja-JP'
    label = '日本語'
    weight = 1
    [languages.ja.params]
      description = 'IT 開発受託・コンサルティングの SHOWWAY 公式サイト'
    [[languages.ja.menu.main]]
    name = '事業内容'
    url = '/services/'
    weight = 10
    [[languages.ja.menu.main]]
    name = '実績'
    url = '/actual_list/'
    weight = 15
    [[languages.ja.menu.main]]
    name = '会社情報'
    url = '/about/'
    weight = 20
    [[languages.ja.menu.main]]
    name = 'ブログ'
    url = '/posts/'
    weight = 30
    [[languages.ja.menu.main]]
    name = 'お問い合わせ'
    url = '/contact/'
    weight = 40

  [languages.en]
    locale = 'en-US'
    label = 'English'
    weight = 2
    [languages.en.params]
      description = 'SHOWWAY provides contract software development and technology consulting.'
    [[languages.en.menu.main]]
    name = 'Services'
    url = '/en/services/'
    weight = 10
    [[languages.en.menu.main]]
    name = 'Work'
    url = '/en/actual_list/'
    weight = 15
    [[languages.en.menu.main]]
    name = 'About'
    url = '/en/about/'
    weight = 20
    [[languages.en.menu.main]]
    name = 'Blog'
    url = '/posts/'
    weight = 30
    [[languages.en.menu.main]]
    name = 'Contact'
    url = '/en/contact/'
    weight = 40

  [languages.kagoshima]
    locale = 'ja-JP-x-kagoshima'
    label = '鹿児島弁'
    weight = 3
    [languages.kagoshima.params]
      description = 'IT開発受託と技術相談をしちょっSHOWWAYじゃっど。'
    [[languages.kagoshima.menu.main]]
    name = 'でくっこっ'
    url = '/kagoshima/services/'
    weight = 10
    [[languages.kagoshima.menu.main]]
    name = '仕事ん実績'
    url = '/kagoshima/actual_list/'
    weight = 15
    [[languages.kagoshima.menu.main]]
    name = '会社んこっ'
    url = '/kagoshima/about/'
    weight = 20
    [[languages.kagoshima.menu.main]]
    name = 'ブログ'
    url = '/posts/'
    weight = 30
    [[languages.kagoshima.menu.main]]
    name = '連絡すっ'
    url = '/kagoshima/contact/'
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github'
    lineNos = false
    tabWidth = 2
